<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Task Board</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Team Task Board</h1>

        <p class="subtitle">
            Simple collaborative task management
        </p>

        <div class="task-input">
            <input 
                type="text" 
                id="taskInput" 
                placeholder="Enter a new task"
            >

            <button onclick="addTask()">
                Add Task
            </button>
        </div>

        <div class="stats">

            <div>
                <strong id="totalTasks">0</strong>
                <span>Total</span>
            </div>

            <div>
                <strong id="completedTasks">0</strong>
                <span>Completed</span>
            </div>

            <div>
                <strong id="pendingTasks">0</strong>
                <span>Pending</span>
            </div>

        </div>

        <ul id="taskList"></ul>

    </div>

    <script src="script.js"></script>

</body>
</html>
